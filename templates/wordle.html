<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wordle</title>

    <style>
        :root {
            /* --letter_input_margin: 0.2em;
            --letter_input_width: calc(100vw / {{word_length}} - var(--letter_input_margin) * 2 * {{word_length}}); */
            --letter_input_margin: 0;
            --letter_input_width: 0;
            --letter_input_height: 0;
            --letter_input_border_width: 0;
        }

        body {
            font-family: "Blackbaud Sans","Helvetica Neue",Arial,sans-serif;
            text-align: center;
        }

        .word_input_div {
            display: inline-block;
            pointer-events: none;
            margin: 0 auto;
            font-size: 2em;
        }

        .letter_input {
            width: var(--letter_input_width);
            height: var(--letter_input_height);
            text-align: center;
            font-size: 2em;
            line-height: 1.5em;
            font-weight: bold;
            border-radius: 0.2em;
            border-width: var(--letter_input_border_width);
            margin: var(--letter_input_margin);
            border-style: solid;
            text-transform: capitalize;
            padding: 0;
            box-sizing: border-box;
        }

        .letter_input_active {
            border-color: darkgrey;
            caret-color: transparent;
        }

        .letter_input_active:focus {
            border-color: black;
            outline: 0;
            box-shadow: 0;
        }

        .letter_input_correct {
            border-color: green;
        }

        .letter_input_present {
            border-color: orange;
        }

        .letter_input_incorrect {
            border-color: red;
        }

        .win_message {
            color: green;
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            margin: 0.5em;
        }

        .loss_message {
            color: red;
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            margin: 0.5em;
        }

        .uneligible_message {
            color: black;
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            margin: 0.5em;
        }

        .blank_message {
            color: transparent;
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            margin: 0.5em;
        }
    </style>

</head>
<body>
<div id="word_input_area" class="word_input_div">
    <p id="message" class="blank_message">PLACEHOLDER</p>
</div>
</body>

<script>
    let letter_input_height = 0;

    // Initialize css variables
    function init_css_vars(event) {
        // var vw = window.innerWidth/100;
        // var vh = window.innerHeight/100;
        var vw = document.body.clientWidth/100;
        var vh = document.body.clientHeight/100;

        var word_length_unit = vw / {{word_length}};

        var letter_input_margin = 2 * word_length_unit;
        var letter_input_border_width = 10 * word_length_unit;
        //var letter_input_width = ((100 * vw) / {{word_length}}) - (letter_input_margin * 2 * {{word_length}}) - (letter_input_border_width * 2);
        var letter_input_width = ((100 * vw) / {{word_length}}) - (letter_input_margin * 2);
        letter_input_height = 0.9 * letter_input_width;
        document.documentElement.style.setProperty('--letter_input_margin', letter_input_margin + "px");
        document.documentElement.style.setProperty('--letter_input_width', letter_input_width + "px");   
        document.documentElement.style.setProperty('--letter_input_height', letter_input_height + "px");
        document.documentElement.style.setProperty('--letter_input_border_width', letter_input_border_width + "px");
    }

    window.addEventListener("load", init_css_vars);
    window.addEventListener("resize", init_css_vars);

    function getCookie(cname) {
    let name = cname + "=";
    let decodedCookie = decodeURIComponent(document.cookie);
    let ca = decodedCookie.split(';');
    for(let i = 0; i <ca.length; i++) {
        let c = ca[i];
        while (c.charAt(0) == ' ') {
        c = c.substring(1);
        }
        if (c.indexOf(name) == 0) {
        return c.substring(name.length, c.length);
        }
    }
    return null;
    }

    document.body.onmousedown = function (event) {
        return false;
    }

    // get uuid from cookie, otherwise use the one generated by the server
    let uuid = getCookie("uuid");
    if (uuid == null) {
        var uuid_xhr = new XMLHttpRequest();
        uuid_xhr.open("GET", "/geffen-wordle/generate-uuid", false);
        uuid_xhr.send();
        uuid = uuid_xhr.responseText;
        document.cookie = `uuid=${uuid}; SameSite=None; Secure`;
    }

    // Check if uuid is eligible to play
    var eligibility_xhr = new XMLHttpRequest();
    eligibility_xhr.open("POST", "/geffen-wordle/uuid-eligible", false);
    eligibility_xhr.setRequestHeader("Content-Type", "application/json");
    eligibility_xhr.send(JSON.stringify({"word": "{{word}}", "uuid": uuid}));

    let eligible = eligibility_xhr.status == 200 && JSON.parse(eligibility_xhr.responseText)["eligible"];

    // Array to hold input boxes
    let input_boxes = new Array({{num_attempts}});
    let input_area = document.getElementById("word_input_area");
    let active_row = 0;
    let active_col = 0;
    let word = "{{word}}".toLowerCase();

    if (eligible) {
        main();
    } else {
        var rank_xhr = new XMLHttpRequest();
        rank_xhr.open("POST", "/geffen-wordle/get-rank", false);
        rank_xhr.setRequestHeader("Content-Type", "application/json");
        rank_xhr.send(JSON.stringify({"uuid": uuid, "word": word}));
        
        var rank = rank_xhr.responseText;

        let message = document.getElementById("message");
        message.classList.remove("blank_message");
        message.classList.add("uneligible_message");
        message.innerText = `You have already played this word. \n${rank}`;
    }

    function submit_result() {
        var out = {};
        out["word"] = word;
        out["uuid"] = uuid;
        out["rows"] = {};
        for (let i = 0; i < {{num_attempts}}; i++) {
            out["rows"][i] = "";
            for (let j = 0; j < {{word_length}}; j++) {
                out["rows"][i] += input_boxes[i][j].value;
            }
        }

        var result_xhr = new XMLHttpRequest();
        result_xhr.open("POST", "/geffen-wordle/submit-result", false);
        result_xhr.setRequestHeader("Content-Type", "application/json");
        result_xhr.send(JSON.stringify(out));
        
        return result_xhr.responseText;
    }

    function main() {
        // Create input boxes
        for (let i = 0; i < {{num_attempts}}; i++) {
            input_boxes[i] = new Array({{word_length}});
            for (let j = 0; j < {{word_length}}; j++) {
                input_boxes[i][j] = document.createElement("input");
                //document.getElementById("word_input_area").innerHTML += `<input type="text" name="${i}${j}" id="${i}${j}" class="letter_input_neutral" maxlength="1">`;
                input_boxes[i][j].type = "text";
                input_boxes[i][j].id = `${i}${j}`;
                
                if (i == active_row) {
                    input_boxes[i][j].classList.add("letter_input_active");
                } else {
                    input_boxes[i][j].classList.add("letter_input_inactive");
                }
                input_boxes[i][j].classList.add("letter_input");

                input_boxes[i][j].maxLength = 1;
                input_boxes[i][j].tabIndex = -1;

            }
        }

        for (let i = 0; i < {{num_attempts}}; i++) {
            for (let j = 0; j < {{word_length}}; j++) {
                // Add event listeners to input boxes
                input_boxes[i][j].onkeydown =  function (event) {
                    input_boxes[i][j].value = input_boxes[i][j].value.toLowerCase();
                    console.log(input_boxes[i][j].value);
                    // Go to next input box and go back on backspace if we aren't on the zeroth input box
                    if (event.code == "Backspace" && j > 0) {
                        input_boxes[i][j - 1].focus();
                        active_col = j - 1;
                        input_boxes[i][j].value = "";
                    } else if (event.code == "Space" || event.code == "ArrowRight") {
                        if (j < {{word_length}} - 1) {
                            input_boxes[i][j + 1].focus();
                            active_col = j + 1;
                        }
                    } else if (event.code == "ArrowLeft") {
                        if (j > 0) {
                            input_boxes[i][j - 1].focus();
                            active_col = j - 1;  
                        }
                    } else if (input_boxes[i][j].value.length > 0 && event.code == `Key${event.key.toUpperCase()}` && j < {{word_length}} - 1) {
                        input_boxes[i][j + 1].focus();
                        active_col = j + 1;
                        input_boxes[i][j + 1].value = event.key;
                    } else if (input_boxes[i][j].value.length == 0 && event.code == `Key${event.key.toUpperCase()}` && j < {{word_length}} - 1) {
                        input_boxes[i][j + 1].focus();
                        active_col = j + 1;
                        input_boxes[i][j].value = event.key;
                        return false;
                    } else if (input_boxes[i][j].value.length == 0 && event.code == `Key${event.key.toUpperCase()}` && j == {{word_length}} - 1) {
                        input_boxes[i][j].value = event.key;
                        return false;
                    } else if (j == {{word_length}} - 1 && input_boxes[i][j].value.length > 0 && event.code == "Enter") {
                        // Submission Logic

                        let num_correct = 0;
                        let num_empty = 0;

                        // Create dictionary of letter occurence counts
                        let answer_letter_counts = {};

                        for (let k = 0; k < {{word_length}}; k++) {
                            answer_letter_counts[word[k]] = (answer_letter_counts[word[k]] || 0) + 1;
                        }

                        for (let k = 0; k < {{word_length}}; k++) {
                            console.log(input_boxes[i][k].value);
                            
                            // Check answer
                            if (input_boxes[i][k].value.toLowerCase() == word[k]) {
                                input_boxes[i][k].classList.remove("letter_input_active");
                                input_boxes[i][k].classList.add("letter_input_correct");
                                num_correct++;
                                answer_letter_counts[input_boxes[i][k].value] = (answer_letter_counts[input_boxes[i][k].value] || 0) - 1;
                            } else if (word.includes(input_boxes[i][k].value) && answer_letter_counts[input_boxes[i][k].value] > 0) {
                                input_boxes[i][k].classList.remove("letter_input_active");
                                input_boxes[i][k].classList.add("letter_input_present");
                                answer_letter_counts[input_boxes[i][k].value] = (answer_letter_counts[input_boxes[i][k].value] || 0) - 1;
                            } else if (input_boxes[i][k].value == "") {
                                num_empty++;
                            } else {
                                input_boxes[i][k].classList.remove("letter_input_active");
                                input_boxes[i][k].classList.add("letter_input_incorrect");
                            }
                        }

                        if (num_empty > 0) {
                            return false;
                        }

                        if (active_row == {{num_attempts}} - 1 && num_correct != {{word_length}}) {
                            // Loss
                            var rank = submit_result();

                            let loss_message = document.getElementById("message");
                            loss_message.classList.remove("blank_message");
                            loss_message.classList.add("loss_message");
                            loss_message.innerText = "You lost! The word was " + word + `. ${rank}`;

                            // Scroll to bottom
                            window.scrollTo(0, document.body.scrollHeight);
                            
                            return false;
                        }

                        if (num_correct == {{word_length}}) {
                            // Win!
                            // Remove subsequent input boxes
                            for (let k = active_row + 1; k < {{num_attempts}}; k++) {
                                for (let l = 0; l < {{word_length}}; l++) {
                                    input_boxes[k][l].remove();
                                }
                                document.getElementById(`br_${k}`).remove();
                            }

                            var rank = submit_result();

                            // Show win message
                            let win_message = document.getElementById("message");
                            win_message.classList.remove("blank_message");
                            win_message.classList.add("win_message");
                            win_message.innerText = `You win! ${rank}`;

                            // Scroll to bottom
                            window.scrollTo(0, document.body.scrollHeight);

                            return false;
                        }

                        active_row++;
                        active_col = 0;
                        input_boxes[active_row][active_col].focus();

                        for (let k = 0; k < {{word_length}}; k++) {
                            input_boxes[active_row][k].classList.remove("letter_input_inactive");
                            input_boxes[active_row][k].classList.add("letter_input_active");
                        }

                        // Scroll to center active row
                        window.scrollTo(0, active_row * letter_input_height - letter_input_height);

                    } else {
                        return false;
                    }
                    // if (input_boxes[i][j].value.length > 0 && j < {{word_length}} - 1) {
                    //     input_boxes[i][j + 1].focus();
                    //     active_col = j + 1;
                    //     input_boxes[i][j + 1].value = event.key;
                    // } else if (input_boxes[i][j].value.length == 0 && j > 0) {
                    //     input_boxes[i][j - 1].focus();
                    //     active_col = j - 1;
                    // }
                }
            }
        }

        for (let i = 0; i < {{num_attempts}}; i++) {
            for (let j = 0; j < {{word_length}}; j++) {
                input_area.appendChild(input_boxes[i][j]);
            }
            let br = document.createElement("br");
            br.id = `br_${i}`;
            input_area.appendChild(br);
        }

        // async function keepFocused() {
        //     while (true) {
        //         if (document.hasFocus()) {
        //             input_boxes[active_row][active_col].focus();
        //         }
        //         // sleep 100ms
        //         await new Promise(r => setTimeout(r, 100));   
        //     }
        // }

        // keepFocused();

        document.documentElement.addEventListener("click", function (event) {input_boxes[active_row][active_col].focus();});

        // Move message to bottom
        var message = document.getElementById("message");
        document.getElementById("word_input_area").removeChild(message);
        document.getElementById("word_input_area").appendChild(message);
    }

</script>

</html>
