<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tabs">
        <button class="tab-button active" data-tab="wordle">Weekly Wordle</button>
        <button class="tab-button" data-tab="sudoku">Weekly Sudoku</button>
    </div>

    <div id="wordle" class="tab-content active">
        <div class="container">
            <h1>Weekly Wordle</h1>
            <h2>Week <span id="week-display">...</span></h2>
            <div id="message"></div>
            <div id="board"></div>
            <p class="instructions">Type using your physical keyboard. Press Enter to submit.</p>
        </div>
    </div>

    <div id="sudoku" class="tab-content">
        <div class="container">
            <h1>Weekly Sudoku</h1>
            <h2>Week <span id="sudoku-week-display">...</span></h2>
            <div id="sudoku-message"></div>
            <div id="sudoku-board"></div>
            <p class="instructions">Click a cell and type 1-9 to fill. Use Backspace to clear.</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
